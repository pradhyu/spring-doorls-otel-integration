version: '3.8'

services:
  # 1. Spring Boot Drools + OpenTelemetry Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drools-otel-app-aspire
    ports:
      - "8080:8080"
    environment:
      - SPRING_APPLICATION_NAME=drools-otel-app
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
      - LOGGING_LEVEL_COM_EXAMPLE_DROOLSOTEL=DEBUG
    depends_on:
      - aspire-dashboard
    networks:
      - otel-net

  # 2. .NET Aspire Dashboard
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: aspire-dashboard
    ports:
      - "18888:18888" # Dashboard UI (HTTP)
      - "4317:18889"   # OTLP gRPC endpoint
      - "4318:18890"   # OTLP HTTP endpoint
    environment:
      - ASPIRE_ALLOW_UNSECURED_CONNECTION=true
      - Dashboard__Api__AuthMode=Unsecured
      - Dashboard__Api__Enabled=true
    networks:
      - otel-net

networks:
  otel-net:
    driver: bridge
