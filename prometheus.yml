global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'java'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['drools-otel-app:8080']
        labels:
          application: 'drools-otel-app'

  - job_name: 'otel-collector'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['otel-collector:8889']
