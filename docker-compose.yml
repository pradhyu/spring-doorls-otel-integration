version: '3.8'

services:
  # 1. Spring Boot Drools + OpenTelemetry Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drools-otel-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_APPLICATION_NAME=drools-otel-app
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - LOGGING_LEVEL_COM_EXAMPLE_DROOLSOTEL=DEBUG
    depends_on:
      - otel-collector
      - jaeger
    networks:
      - otel-net

  # 2. OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:z
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8888:8888" # OTEL Collector internal metrics
      - "8889:8889" # Prometheus scrape endpoint (OTel Collector metrics exporter)
    depends_on:
      - jaeger
    networks:
      - otel-net

  # 3. Jaeger All-in-One (Traces UI & OTLP endpoint)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger Web UI
      - "14268:14268" # Jaeger collector HTTP
      - "14250:14250" # Jaeger collector gRPC
    networks:
      - otel-net

  # 4. Proxy Microservice
  proxy:
    build:
      context: ./proxy-service
      dockerfile: Dockerfile
    container_name: proxy-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_APPLICATION_NAME=proxy-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - DROOLS_APP_URL=http://drools-otel-app:8080/api/rules/execute
      - LOGGING_LEVEL_COM_EXAMPLE_PROXY=DEBUG
    depends_on:
      - otel-collector
      - app
    networks:
      - otel-net

  # 5. Prometheus (Metrics TSDB)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:z
    ports:
      - "9090:9090"
    depends_on:
      - app
      - otel-collector
    networks:
      - otel-net

  # 6. Grafana (Visualization UI)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:z
    depends_on:
      - prometheus
      - jaeger
    networks:
      - otel-net

networks:
  otel-net:
    driver: bridge

